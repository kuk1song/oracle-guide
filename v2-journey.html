<style>
/* 外观：默认彩色；构建时给 html 加 data-look="mono" 就是黑白版。
   深浅色跟随系统；地址后加 ?scheme=light 或 ?scheme=dark 可以强制（对比页用）。 */
:root{
  --bg:#F2F4F6;--surface:#FFFFFF;--sunk:#EDF1F4;--ink:#13202B;--muted:#4F5F70;--line:#DAE1E7;--rule:#DAE1E7;
  --accent:#0B6A62;--accent-soft:#E4F1EF;--accent-ink:#FFFFFF;--focus:#2A5F96;
  --ok:#1C7148;--info:#2A5F96;--warn:#865509;--stop:#AA2D28;
  --r-card:14px;--r-ctl:12px;--r-box:6px;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --display:var(--sans);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-scheme=light]){
  --bg:#0D1318;--surface:#151D24;--sunk:#10181E;--ink:#E5ECF2;--muted:#97A7B7;--line:#26333E;--rule:#26333E;
  --accent:#48CDBB;--accent-soft:#11302B;--accent-ink:#04201B;--focus:#8BB8EA;
  --ok:#72D39E;--info:#8BB8EA;--warn:#E7B868;--stop:#F19089;
  color-scheme:dark;
}}
:root[data-scheme=dark]{
  --bg:#0D1318;--surface:#151D24;--sunk:#10181E;--ink:#E5ECF2;--muted:#97A7B7;--line:#26333E;--rule:#26333E;
  --accent:#48CDBB;--accent-soft:#11302B;--accent-ink:#04201B;--focus:#8BB8EA;
  --ok:#72D39E;--info:#8BB8EA;--warn:#E7B868;--stop:#F19089;
  color-scheme:dark;
}
/* 黑白版：同一套结构，换掉色板、圆角和几处排版 */
:root[data-look=mono]{
  --bg:#FFFFFF;--surface:#FFFFFF;--sunk:#F3F3F3;--ink:#0A0A0A;--muted:#6B6B6B;--line:#E2E2E2;--rule:#0A0A0A;
  --accent:#0A0A0A;--accent-soft:#F3F3F3;--accent-ink:#FFFFFF;--focus:#0A0A0A;
  --ok:#0A0A0A;--info:#0A0A0A;--warn:#0A0A0A;--stop:#0A0A0A;
  --r-card:0;--r-ctl:0;--r-box:0;
  --display:Didot,"Bodoni 72","Bodoni MT",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root[data-look=mono]:not([data-scheme=light]){
  --bg:#0A0A0A;--surface:#0A0A0A;--sunk:#161616;--ink:#F2F2F2;--muted:#9B9B9B;--line:#2A2A2A;--rule:#F2F2F2;
  --accent:#F2F2F2;--accent-soft:#161616;--accent-ink:#0A0A0A;--focus:#F2F2F2;
  --ok:#F2F2F2;--info:#F2F2F2;--warn:#F2F2F2;--stop:#F2F2F2;
  color-scheme:dark;
}}
:root[data-look=mono][data-scheme=dark]{
  --bg:#0A0A0A;--surface:#0A0A0A;--sunk:#161616;--ink:#F2F2F2;--muted:#9B9B9B;--line:#2A2A2A;--rule:#F2F2F2;
  --accent:#F2F2F2;--accent-soft:#161616;--accent-ink:#0A0A0A;--focus:#F2F2F2;
  --ok:#F2F2F2;--info:#F2F2F2;--warn:#F2F2F2;--stop:#F2F2F2;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.lock,html.lock body{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
p{margin:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
.wrap{max-width:600px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right)) calc(104px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}

.hero{padding:calc(28px + env(safe-area-inset-top)) 0 4px}
.eyebrow{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
h1{margin:6px 0;font-size:27px;font-weight:700;line-height:1.25;letter-spacing:-.01em}
.lede{color:var(--muted);font-size:15px;max-width:30em}
.prog{margin-top:18px}
.segs{display:flex;gap:4px}
.sg{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.sg i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.sg.lock{opacity:.45}
.prog-t{margin-top:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog-t b{color:var(--ink);font-weight:600}

.panel{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card)}
.hero+.panel{margin-top:22px}
details.panel>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:52px;padding:12px 16px;font-weight:600}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::after{content:"";flex:none;margin-left:auto;width:7px;height:7px;border:solid var(--muted);border-width:0 1.5px 1.5px 0;transform:translateY(-2px) rotate(45deg);transition:transform .2s}
details[open].panel>summary::after{transform:translateY(1px) rotate(-135deg)}
.panel .sm{font-size:13px;font-weight:400;color:var(--muted)}
.panel .in{padding:0 16px 14px}
.rules{margin:0;padding:0;list-style:none;counter-reset:r}
.rules li{counter-increment:r;display:grid;grid-template-columns:22px 1fr;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.rules li::before{content:counter(r);font-weight:650;color:var(--accent);font-variant-numeric:tabular-nums}
.rules b{font-weight:600}
.rules .d{display:block;color:var(--muted);font-size:14px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.duo h4{margin:2px 0 4px;font-size:14px}
.duo ul{margin:0;padding-left:18px;font-size:14px;color:var(--muted)}
.foot{margin-top:10px;font-size:13px;color:var(--muted)}
.tag{display:inline-block;margin-left:6px;padding:0 6px;font-size:11px;font-weight:500;line-height:18px;letter-spacing:.02em;
  color:var(--muted);border:1px solid var(--line);border-radius:4px;vertical-align:2px;white-space:nowrap}
.tag.official{color:var(--info)}

.timeline{margin:26px 0 0;padding:0;list-style:none;position:relative}
.timeline::before{content:"";position:absolute;left:15px;top:22px;bottom:22px;width:2px;background:var(--line)}
.phase{position:relative;padding-left:46px;margin-bottom:10px}
.node{position:absolute;left:0;top:13px;z-index:1;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--bg);border:1.5px solid var(--line);color:var(--muted)}
.node i{font-style:normal}
.phase.now .node{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.phase.done .node{border-color:var(--accent);color:var(--accent)}
.phase.lock .node{border-style:dashed}
.nowl{display:none}
.ph{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.phase.lock .ph{background:transparent}
.ph-h{width:100%;display:flex;align-items:center;gap:12px;min-height:58px;padding:12px 16px;background:none;border:0;text-align:left;cursor:pointer}
.ph-t{flex:1;min-width:0}
.ph-t b{display:block;font-size:17px;font-weight:600;line-height:1.35}
.ph-t>span{display:block;font-size:13px;color:var(--muted)}
.meta{flex:none;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.phase.done .meta{color:var(--ok);font-weight:600}
.ph-h::after{content:"";flex:none;width:7px;height:7px;border:solid var(--muted);border-width:0 1.5px 1.5px 0;transform:translateY(-2px) rotate(45deg);transition:transform .2s}
.ph-h[aria-expanded=true]::after{transform:translateY(1px) rotate(-135deg)}
.ph-b{display:none;padding:0 16px 16px}
.phase.open .ph-b{display:block}
.intro{margin-bottom:6px;color:var(--muted);font-size:15px}
.locknote{margin:8px 0 4px;font-size:14px;color:var(--muted)}
.q{padding:14px 0;border-top:1px solid var(--line)}
.q-t{font-weight:600;font-size:16px;line-height:1.45}
.q-h{margin:4px 0 10px;font-size:14px;color:var(--muted)}
.opts{display:grid;gap:8px;counter-reset:o}
.opt{display:flex;align-items:center;gap:12px;min-height:48px;padding:11px 14px;text-align:left;line-height:1.4;
  border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--surface);cursor:pointer;counter-increment:o}
.opt::before{content:"";flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted)}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed=true]::before{border:5.5px solid var(--accent)}
@media (hover:hover){.opt:hover{border-color:var(--muted)}.opt[aria-pressed=true]:hover{border-color:var(--accent)}}
.reply{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--sunk);font-size:15px;line-height:1.6}
.tl{font-weight:650;color:var(--c);margin-right:6px}
.t-warn{--c:var(--warn)}.t-stop{--c:var(--stop)}
.ck{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.ck input{appearance:none;-webkit-appearance:none;width:22px;height:22px;margin:2px 0 0;border:1.5px solid var(--muted);border-radius:var(--r-box);display:grid;place-items:center;background:var(--surface);cursor:pointer}
.ck input:checked{background:var(--accent);border-color:var(--accent)}
.ck input:checked::after{content:"";width:5px;height:10px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.ck input:disabled{opacity:.5;cursor:default}
.ck:has(input:disabled){cursor:default}
.ck b{font-weight:600;line-height:1.45}
.ck ol{margin:4px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}
.ck li{margin:2px 0}

.ldg{display:grid;gap:10px}
.lf{display:grid;grid-template-columns:6.5em 1fr;gap:10px;align-items:center;font-size:14px;color:var(--muted)}
.lf input{width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px}
.lf input::placeholder{color:var(--muted);opacity:.75}

.bar{position:fixed;left:0;right:0;bottom:0;z-index:8;padding:10px max(16px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:var(--surface);border-top:1px solid var(--line)}
.bar .in{max-width:600px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;min-height:50px;padding:0 16px;border:0;border-radius:var(--r-ctl);background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer}
.btn:active{opacity:.85}
.btn.sec{flex:none;background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sec[data-arm]{color:var(--stop);border-color:var(--stop)}
.sheet{position:fixed;top:0;right:0;bottom:0;left:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(6,12,18,.5)}
.sheet[hidden]{display:none}
.box{width:100%;max-width:600px;max-height:88vh;overflow:auto;background:var(--surface);border-radius:var(--r-card) var(--r-card) 0 0;padding:18px max(16px,env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.box h2{margin:0;font-size:17px;font-weight:600}
.sheet pre{max-height:50vh;overflow:auto;margin:10px 0 14px;padding:14px;white-space:pre-wrap;font:14px/1.7 var(--sans);background:var(--sunk);border-radius:10px;-webkit-user-select:text;user-select:text}
.box .acts{display:flex;gap:10px}
.src{margin-top:28px;font-size:13px;color:var(--muted)}
.src a{color:var(--info);text-underline-offset:2px}
.src ul{margin:4px 0 8px;padding-left:18px}
.noscript{margin:24px 16px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
@media (max-width:380px){.duo{grid-template-columns:1fr}h1{font-size:24px}.lf{grid-template-columns:1fr;gap:4px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* 黑白版的排版差异 */
[data-look=mono] .hero{padding-bottom:20px;border-bottom:2px solid var(--rule)}
[data-look=mono] .eyebrow{color:var(--ink);font-size:12px;letter-spacing:.06em}
[data-look=mono] h1{margin:10px 0 8px;font-size:31px;line-height:1.2;letter-spacing:-.02em}
[data-look=mono] .sg{height:3px;border-radius:0;background:linear-gradient(var(--muted),var(--muted)) center/100% 1px no-repeat}
[data-look=mono] .sg.lock{opacity:1;background:repeating-linear-gradient(90deg,var(--muted) 0 1px,transparent 1px 4px) center/100% 1px no-repeat}
[data-look=mono] .panel{margin-top:0;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0}
[data-look=mono] details.panel>summary{padding:14px 0}
[data-look=mono] details.panel>summary::after{content:"+";width:auto;height:auto;border:0;transform:none;font-weight:300;font-size:22px;line-height:1;color:var(--ink)}
[data-look=mono] details[open].panel>summary::after{content:"\2212";transform:none}
[data-look=mono] .panel .in{padding:0 0 16px}
[data-look=mono] .rules li{grid-template-columns:30px 1fr}
[data-look=mono] .rules li::before{font:400 22px/1.1 var(--display);color:var(--ink)}
[data-look=mono] .tag.official{color:var(--ink);border-color:var(--ink)}
[data-look=mono] .timeline{margin-top:30px}
[data-look=mono] .timeline::before{display:none}
[data-look=mono] .phase{margin:0;padding-left:58px;border-top:1px solid var(--rule)}
[data-look=mono] .phase:last-child{border-bottom:1px solid var(--rule)}
[data-look=mono] .node,[data-look=mono] .phase.now .node,[data-look=mono] .phase.done .node{top:15px;display:block;width:auto;height:auto;background:none;border:0;border-radius:0;
  font:400 34px/1 var(--display);letter-spacing:-.02em;color:var(--ink)}
[data-look=mono] .node i{display:none}
[data-look=mono] .node::after{content:attr(data-n)}
[data-look=mono] .phase.done .node{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
[data-look=mono] .phase.lock .node,[data-look=mono] .phase.lock .ph-t b{color:var(--muted)}
[data-look=mono] .nowl{display:inline-block;margin-left:8px;padding:0 6px;font-size:11px;font-weight:500;line-height:19px;letter-spacing:.08em;vertical-align:2px;background:var(--ink);color:var(--bg)}
[data-look=mono] .ph,[data-look=mono] .phase.lock .ph{background:none;border:0;border-radius:0;overflow:visible}
[data-look=mono] .ph-h{padding:16px 0;min-height:64px}
[data-look=mono] .ph-h::after{content:"+";width:auto;height:auto;border:0;transform:none;font-weight:300;font-size:22px;line-height:1;color:var(--ink)}
[data-look=mono] .ph-h[aria-expanded=true]::after{content:"\2212";transform:none}
[data-look=mono] .ph-b{padding:0 0 20px}
[data-look=mono] .opt{border-color:var(--ink)}
[data-look=mono] .opt::before{content:counter(o,upper-latin);width:1.1em;height:auto;border:0;border-radius:0;font:400 17px/1 var(--display)}
[data-look=mono] .opt[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
[data-look=mono] .opt[aria-pressed=true]::before{border:0}
@media (hover:hover){[data-look=mono] .opt:hover{border-color:var(--ink);background:var(--sunk)}[data-look=mono] .opt[aria-pressed=true]:hover{background:var(--ink)}}
[data-look=mono] .reply{margin-top:12px;padding:12px 0 0;background:none;border-radius:0;border-top:1px solid var(--line)}
[data-look=mono] .tl{display:inline-block;margin-right:8px;padding:0 6px;font-size:12px;line-height:20px;letter-spacing:.06em;border:1px solid var(--ink);vertical-align:1px}
[data-look=mono] .tl.t-stop{background:var(--ink);color:var(--bg)}
[data-look=mono] .lf input{padding:8px 0;border:0;border-bottom:1px solid var(--ink);border-radius:0;background:none}
[data-look=mono] .bar{border-top:1px solid var(--rule)}
[data-look=mono] .btn.sec{border-color:var(--ink)}
[data-look=mono] .sheet{background:rgba(0,0,0,.55)}
[data-look=mono] .src a{color:var(--ink)}
@media (max-width:380px){[data-look=mono] h1{font-size:26px}}
</style>

<div class="wrap">
  <header class="hero">
    <p class="eyebrow" id="eb"></p>
    <h1 id="h1"></h1>
    <p class="lede" id="lede"></p>
    <div class="prog" id="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="segs" id="segs" aria-hidden="true"></div>
      <p class="prog-t" id="progT"></p>
    </div>
  </header>
  <details class="panel"><summary><span id="rulesN"></span><span class="sm">先读</span></summary><div class="in"><ol class="rules" id="rules"></ol></div></details>
  <details class="panel"><summary><span id="promT"></span></summary><div class="in" id="prom"></div></details>
  <ol class="timeline" id="tl"></ol>
  <details class="panel" open><summary><span>我的记录</span><span class="sm">只存在这个浏览器里</span></summary><div class="in"><div class="ldg" id="ldg"></div></div></details>
  <footer class="src" id="src"></footer>
</div>
<div class="sr" id="live" aria-live="polite"></div>
<div class="bar"><div class="in"><button class="btn sec" id="reset" type="button">清空</button><button class="btn" id="share" type="button">生成进度</button></div></div>
<div class="sheet" id="sheet" hidden><div class="box" role="dialog" aria-modal="true" aria-labelledby="shT">
  <h2 id="shT">把下面这段发给 <span id="shH"></span></h2>
  <p class="foot">按钮复制不了的话，长按文字全选复制，或者直接截图。</p>
  <pre id="sum"></pre>

<script>window.GUIDE={"meta": {"title": "Oracle 免费服务器上手指南", "updated": "2026-11-20", "edition": "第 1 版"}, "config": {"friend": "", "helper": "kuki", "region": "Germany Central (Frankfurt)", "regionWhy": "欧洲用着快；法兰克福有 3 个可用区，抢 ARM 机的机会比只有 1 个可用区的地方多", "backupRegion": "UK South (London)", "unlockedPhase": 1, "storageKey": "default"}, "tags": {"official": "Oracle 官方", "community": "网上经验", "helper": "{helper} 的判断", "todo": "待核实"}, "rules": [{"t": "一人只能有一个账号", "d": "以前注册过就用旧的，不要再开新号；也不要用家人的卡或身份。", "tag": "official"}, {"t": "注册时关掉 VPN 和代理", "d": "人在国内就用手机热点。", "tag": "community"}, {"t": "信息全部真实", "d": "名字、地址和卡上的一致，卡是你本人的。", "tag": "official"}, {"t": "密码和私钥只留在你手里", "d": "密码、私钥、验证码、备用码不发给任何人，包括 {helper}。", "tag": "helper"}, {"t": "被拒两次就停", "d": "不要换卡、换邮箱反复试，截图发给 {helper} 再商量。", "tag": "helper"}, {"t": "不升级付费", "d": "Oracle 原话：不升级，卡就不会被扣钱。这套流程用不到付费账号。", "tag": "helper"}], "promise": {"will": ["在你的小机器上临时放一把 SSH 公钥，帮你装好重试脚本", "请你在控制台加一把 API 公钥（公钥不是密码）"], "wont": ["要你的密码、私钥、验证码", "用自己的机器或网络替你登录、替你发请求"], "after": "抢到当天，删掉 API 公钥和 {helper} 的 SSH 公钥，当着你的面做。"}, "phases": [{"id": "p0", "title": "先看看自己的情况", "who": "你自己", "time": "10 分钟", "intro": "回答几个问题，每题点一个选项，马上告诉你该怎么办。做完生成一张小卡片，截图发给 {helper}。", "steps": [{"id": "account", "type": "choice", "q": "你以前注册过 Oracle Cloud 吗？", "hint": "包括几年前试用过、用别的邮箱注册过、注册到一半没成功的。", "options": [{"v": "no", "label": "没有，从来没有", "tone": "ok", "reply": "好，从零开始。"}, {"v": "has", "label": "注册过，有账号", "tone": "info", "reply": "那就不要再注册新号。Oracle 规定一人只能有一个免费账号。先登录旧账号看看里面有什么，看下一步。"}, {"v": "unsure", "label": "不确定", "tone": "warn", "reply": "在你用过的每个邮箱里搜 oracle 和 oraclecloud。搜到 Oracle Cloud 的欢迎邮件，就是注册成功过，回来改选「注册过」；什么都搜不到再改选「没有」。"}, {"v": "rejected", "label": "试过，但被拒了", "tone": "warn", "reply": "告诉 {helper} 大概哪一年、用的哪张卡、当时页面上写了什么。这会影响这次怎么做。"}], "short": "以前注册过"}, {"id": "old", "type": "task", "showIf": {"account": ["has"]}, "title": "登录旧账号，看三样东西，截图发给 {helper}", "how": ["登录 cloud.oracle.com，要填 Cloud Account Name（账号名，不是邮箱）。账号名写在当年 Oracle 发的账号开通邮件里。", "主区域：右上角头像，点「Tenancy: 你的账号名」，页面上写着 Home region。", "账号类型：左上角菜单，Billing & Cost Management，Upgrade and Manage Payment。页面标题是 Upgrade 就是免费账号，是 Manage Payment 就是已经升级付费了。", "已有的机器：左上角菜单，Compute，Instances。右上角区域选主区域，左边 Compartment 换着看一遍。", "截图前遮住邮箱和卡号。"], "tag": "official"}, {"id": "card", "type": "choice", "q": "你打算用哪张卡？", "hint": "必须是你本人名字的卡。注册时会预授权 1 美元左右做验证，不是扣款；Oracle 马上撤销，银行多久退回看银行。", "options": [{"v": "credit", "label": "信用卡（carta di credito）", "tone": "ok", "reply": "最好。Oracle 官方接受信用卡。"}, {"v": "debit", "label": "借记卡（carta di debito）", "tone": "warn", "reply": "Oracle 只收刷卡时不用输 PIN 的 Visa、Mastercard、Amex、Discover 借记卡，能不能过要试了才知道。有信用卡就优先用信用卡。"}, {"v": "prepaid", "label": "PostePay、预付卡或虚拟卡", "tone": "stop", "reply": "这类卡 Oracle 明确不收（虚拟卡、一次性卡、预付卡都不行）。PostePay 是预付卡（carta prepagata）。需要换一张实体信用卡或借记卡。"}, {"v": "unsure", "label": "不确定是哪种", "tone": "warn", "reply": "看银行 App 里的卡片说明：写 credito 是信用卡，debito 是借记卡，prepagata 是预付卡。"}], "short": "卡"}, {"id": "sca", "type": "choice", "q": "这张卡网上付款时，银行怎么让你确认？", "hint": "注册时银行可能会要你确认一下（3D Secure）。人在国内的话，这一步最容易卡住。", "options": [{"v": "app", "label": "在银行 App 里点确认", "tone": "ok", "reply": "注册前打开银行 App，确认现在能正常登录、能收到推送。"}, {"v": "sms", "label": "短信验证码", "tone": "warn", "reply": "确认绑定的手机号现在能收到短信。人在国内用意大利号的话，要开着国际漫游。"}, {"v": "unsure", "label": "不知道", "tone": "warn", "reply": "在银行 App 里找 3D Secure 或 pagamenti online 的设置，或者问一下银行。"}], "short": "银行确认"}, {"id": "where", "type": "choice", "q": "你打算在哪里注册？", "hint": "这一题只决定什么时候注册，和选哪个区域无关。", "options": [{"v": "italy", "label": "人在意大利", "tone": "ok", "reply": "最好的情况：用家里的网络，不开 VPN，直接注册。"}, {"v": "cn-soon", "label": "在国内，几周内回意大利", "tone": "info", "reply": "建议回意大利再注册：IP、卡、地址、手机号都在一个国家，最干净。这是 {helper} 的判断，Oracle 没有公开这方面的规则。等的时候先把第 1 关准备好。"}, {"v": "cn-long", "label": "在国内，还要待很久", "tone": "warn", "reply": "可以在国内注册：不开 VPN，用手机热点，信息全部填真实的意大利信息。被拒两次就停，等回意大利再试。"}], "short": "在哪注册"}, {"id": "use", "type": "choice", "q": "以后几年，你主要在哪里用这台机器？", "hint": "注册时要选一个主区域，选了永远不能改，免费的机器只能开在这个区域。", "options": [{"v": "eu", "label": "主要在欧洲", "tone": "ok", "reply": "{helper} 建议选 {region}。{regionWhy}。"}, {"v": "cn", "label": "主要在国内", "tone": "info", "reply": "告诉 {helper}，区域要另外商量。"}, {"v": "other", "label": "别的地方，或还不确定", "tone": "info", "reply": "不确定就按 {region}。知道以后会长住哪里的话，先告诉 {helper} 再定。"}], "short": "以后在哪用"}, {"id": "email", "type": "choice", "q": "注册打算用哪个邮箱？", "hint": "一个邮箱只能对应一个 Oracle 账号。以后 Oracle 的重要通知都发到这里。", "options": [{"v": "fresh", "label": "从没注册过 Oracle 的邮箱", "tone": "ok", "reply": "好。确认人在国内时也能收信：Gmail 在国内打不开，Outlook 和 iCloud 邮箱一般直接能收。"}, {"v": "used", "label": "用来注册过 Oracle 的邮箱", "tone": "warn", "reply": "那很可能已经有账号了。回到第一题，按「不确定」的方法查一下。"}], "short": "邮箱"}]}, {"id": "p1", "title": "准备好东西", "who": "你自己", "time": "30 分钟", "intro": "注册前一天准备好。每样准备好就勾上。", "steps": [{"id": "c-card", "type": "task", "title": "卡", "how": ["本人名字的信用卡（优先），或刷卡不用输 PIN 的借记卡。", "在有效期内，网上支付已开通。"], "tag": "official"}, {"id": "c-sca", "type": "task", "title": "银行确认能用", "how": ["银行 App 能登录、能收推送；或者手机能收短信。"]}, {"id": "c-addr", "type": "task", "title": "地址", "how": ["和这张卡在银行登记的地址一致，带邮编。"], "tag": "community"}, {"id": "c-email", "type": "task", "title": "邮箱", "how": ["没注册过 Oracle，人在哪里都能收信，记得密码。"]}, {"id": "c-phone", "type": "task", "title": "手机号", "how": ["填你自己的号码，和地址在同一页。", "Oracle 官方的注册步骤里没有短信验证码这一步。"], "tag": "official"}, {"id": "c-auth", "type": "task", "title": "验证器 App", "how": ["第一次登录 Oracle 必须绑定验证器，以后每次登录都要用。", "装 Oracle Mobile Authenticator，或任何能生成 6 位动态码的 App（官方举例 Google Authenticator）。先确认手机的应用商店里下得到。"], "tag": "official"}, {"id": "c-pc", "type": "task", "title": "电脑", "how": ["用你自己的电脑注册，不用手机。浏览器用最新版的 Chrome、Edge 或 Safari。"]}, {"id": "c-net", "type": "task", "title": "网络", "how": ["关掉 VPN 和所有代理。人在国内就用手机热点。"], "tag": "community"}, {"id": "c-name", "type": "task", "title": "想好账号名", "how": ["Cloud Account Name，以后登录要用。用小写英文字母和数字，页面会提示具体规则。"]}, {"id": "c-call", "type": "task", "title": "约时间", "how": ["和 {helper} 约 30 分钟，视频通话共享屏幕，一起注册。"]}]}, {"id": "p2", "title": "注册账号", "who": "你操作，{helper} 视频陪着", "time": "20 到 30 分钟", "intro": "全程用你自己的电脑和网络。{helper} 只看屏幕、告诉你点哪里。", "steps": [{"id": "s-open", "type": "task", "title": "打开注册页", "how": ["打开 signup.oraclecloud.com（或者 oracle.com/cloud/free，点 Start for free）。"], "tag": "official"}, {"id": "s-basic", "type": "task", "title": "基本信息", "how": ["国家选 Italy，名字按卡上的拼写填，填邮箱。", "点 I am human 过人机验证，再点 Verify my email。", "30 分钟内去邮箱点确认链接，过期要重发。"], "tag": "official"}, {"id": "s-region", "type": "task", "title": "账号名、密码、主区域", "how": ["设密码，起账号名（Cloud Account Name）。", "主区域（Home Region）选 {region}。选了就永远不能改，点之前和 {helper} 再对一遍。"], "tag": "official"}, {"id": "s-addr", "type": "task", "title": "地址和手机号", "how": ["和第 1 关准备的一致。"], "tag": "official"}, {"id": "s-pay", "type": "task", "title": "加卡", "how": ["点 Add payment verification method，选 Credit Card，填卡，点 Finish。", "银行可能让你在 App 或短信里确认一下，确认就行。这是 1 美元左右的验证预授权，不是扣款。"], "tag": "official"}, {"id": "s-done", "type": "task", "title": "同意条款，提交", "how": ["勾选同意条款，点 Start my free trial。", "等 Oracle 发账号开通的邮件，可能要几分钟到几小时。这封邮件里有账号名，留好。"], "tag": "community"}, {"id": "s-mfa", "type": "task", "title": "第一次登录：绑验证器、存备用码", "how": ["按提示点 Enable Secure Verification，选 Mobile App，用验证器扫码。用的不是 Oracle 自己的 App 时，选 Offline Mode or Use Another Authenticator App。", "绑好马上生成备用码：右上角头像，User settings，Security，Bypass codes，Generate。抄在纸上，或存进密码管理器。", "手机丢了只能找 Oracle 在线客服重置，不保证成功，所以备用码一定要存。"], "tag": "official"}, {"id": "s-trial", "type": "task", "title": "知道试用期是怎么回事", "how": ["前 30 天送 300 美元试用额度。这期间只开免费的东西。", "30 天后，用额度开的收费资源会被 Oracle 收回；免费的机器不受影响。不升级，卡就不会被扣钱。"], "tag": "official"}, {"id": "s-fail", "type": "task", "title": "如果被拒", "how": ["把页面提示截图发给 {helper}。最多试两次，不换卡、不换邮箱反复试。"]}]}, {"id": "p3", "title": "开第一台小机器", "who": "{helper} 带你做", "time": "15 分钟", "intro": "先开一台免费的小机器（1 GB 内存）。它马上就能用；后面自动抢 ARM 机的脚本也在这台上跑，用的是你自己的账号和 IP。", "steps": [{"id": "m-shape", "type": "task", "title": "选机型", "how": ["Compute，Instances，Create instance。", "Shape 选 VM.Standard.E2.1.Micro，系统选 Ubuntu 24.04。"]}, {"id": "m-net", "type": "task", "title": "网络", "how": ["新建 VCN 和公网子网，勾选分配公网 IPv4。"]}, {"id": "m-key", "type": "task", "title": "SSH 钥匙", "how": ["在你电脑上生成一对钥匙，{helper} 会给你一条命令。私钥留在你电脑上。", "SSH keys 那一栏选上传公钥文件，按住 Command（Mac）或 Ctrl（Windows），同时选你的公钥和 {helper} 发来的临时公钥（都是 .pub 文件）。"], "tag": "official"}, {"id": "m-disk", "type": "task", "title": "硬盘用默认大小", "how": ["不要调大。免费的硬盘一共 200 GB，要给 ARM 机留空间。"], "tag": "official"}]}, {"id": "p4", "title": "手动试一次 ARM 机", "who": "你自己", "time": "5 分钟", "intro": "运气好的话手动就能建成，后面就不用等了。", "steps": [{"id": "a-try", "type": "task", "title": "建一台", "how": ["Create instance，Shape 选 Ampere 下的 VM.Standard.A1.Flex，调成 2 OCPU、12 GB 内存。", "系统选 Ubuntu 24.04 aarch64，网络选刚才那个 VCN 和公网子网。"], "tag": "official"}, {"id": "a-ad", "type": "task", "title": "三个可用区都试一遍", "how": ["提示 Out of capacity（没货）很正常。换一个 AD（可用区）再点，三个都试一遍。", "真建成了就截图告诉 {helper}。"]}]}, {"id": "p5", "title": "让脚本自动抢", "who": "{helper} 来做，你做一步", "time": "几天到几周", "intro": "脚本每 3 分钟替你点一次「创建」，抢到为止。", "steps": [{"id": "r-setup", "type": "task", "title": "{helper} 装脚本", "how": ["{helper} 登录你的小机器，装好开源的重试脚本。"]}, {"id": "r-api", "type": "task", "title": "你加一把 API 公钥", "how": ["右上角头像，User settings（有的版本叫 My profile），Tokens and keys，Add API key，选 Paste a public key，贴 {helper} 发来的公钥，点 Add。菜单名字在不同版本里不太一样，到时候共享屏幕找。", "把弹出的配置预览复制给 {helper}，里面没有密码和私钥。"], "tag": "official"}, {"id": "r-wait", "type": "task", "title": "等", "how": ["{helper} 上次自己抢用了约 8 天（那个区域只有 1 个可用区）。", "等的时候不要动这台小机器和网络。超过 4 周还没抢到，一起商量要不要停。"]}]}, {"id": "p6", "title": "抢到当天", "who": "一起做", "time": "15 分钟", "intro": "当天做完，不拖。", "steps": [{"id": "d-check", "type": "task", "title": "确认真的有了", "how": ["Compute，Instances 里看到新的 ARM 机，状态 Running，能登录。"]}, {"id": "d-stop", "type": "task", "title": "{helper} 停掉脚本", "how": []}, {"id": "d-api", "type": "task", "title": "你删掉 API 公钥", "how": ["回到同一个页面，勾选那把钥匙，Delete，确认。"], "tag": "official"}, {"id": "d-ssh", "type": "task", "title": "{helper} 删掉自己的 SSH 公钥", "how": ["两台机器上都删，共享屏幕给你看。"]}, {"id": "d-micro", "type": "task", "title": "小机器留不留", "how": ["小机器也免费，可以留着用，也可以删掉。"]}]}, {"id": "p7", "title": "长期保持", "who": "你自己，偶尔看看", "time": "每月 5 分钟", "intro": "免费的机器会被回收，账号丢了也没人能帮你找回，所以要照顾一下。", "steps": [{"id": "k-idle", "type": "task", "title": "机器别闲着", "how": ["连续 7 天 CPU、网络、内存都用得很少的免费机器会被 Oracle 回收。", "{helper} 会放一个占资源很少的常驻程序；你自己用起来更好。"], "tag": "official"}, {"id": "k-login", "type": "task", "title": "每月登录一次", "how": ["登录控制台看一眼，留意 Oracle 的邮件，尤其是说要停用或回收的。", "Oracle 没有说清怎样算在用，每月登录是保险做法。"], "tag": "helper"}, {"id": "k-keep", "type": "task", "title": "存好这几样", "how": ["账号名、密码、验证器备用码、SSH 私钥。", "免费账号不能提交工单，验证器丢了只能找在线客服重置，不保证成功。"], "tag": "official"}, {"id": "k-pay", "type": "task", "title": "不升级、不开收费的东西", "how": ["ARM 机在控制台可能不显示 Always Free 标志，{helper} 的那台也是这样，含义还没查清，升级前务必先问。"], "tag": "helper"}]}], "ledger": [{"id": "l-date", "label": "注册日期", "ph": "例如 2026-12-05"}, {"id": "l-region", "label": "主区域", "ph": "例如 Frankfurt"}, {"id": "l-name", "label": "账号名", "ph": "Cloud Account Name"}, {"id": "l-micro", "label": "小机器建好", "ph": "日期"}, {"id": "l-run", "label": "脚本开始", "ph": "日期"}, {"id": "l-got", "label": "抢到", "ph": "日期"}, {"id": "l-note", "label": "备注", "ph": "不要写密码"}], "sources": [{"t": "Oracle：Always Free 资源说明", "u": "https://docs.oracle.com/en-us/iaas/Content/FreeTier/freetier_topic-Always_Free_Resources.htm"}, {"t": "Oracle：Free Tier 说明（试用额度、不升级不扣款）", "u": "https://docs.oracle.com/iaas/Content/FreeTier/freetier.htm"}, {"t": "Oracle：注册步骤", "u": "https://docs.oracle.com/en-us/iaas/Content/GSG/Tasks/signingup_topic-Sign_Up_for_Free_Oracle_Cloud_Promotion.htm"}, {"t": "Oracle：第一次登录与验证器", "u": "https://docs.oracle.com/iaas/Content/GSG/Tasks/signingin_topic-Signing_In_for_the_First_Time.htm"}, {"t": "Oracle：第三方验证器 App", "u": "https://docs.oracle.com/en-us/iaas/Content/Identity/mfa/learn-using-mobile-authenticator-app-mfa.htm"}, {"t": "Oracle：生成备用码", "u": "https://docs.oracle.com/en-us/iaas/Content/Identity/usersettings/generate-bypass-code.htm"}, {"t": "Oracle：卡的预授权与升级", "u": "https://docs.oracle.com/iaas/Content/Billing/Tasks/changingpaymentmethod.htm"}, {"t": "Oracle：区域与可用区", "u": "https://docs.oracle.com/en-us/iaas/Content/General/Concepts/regions.htm"}, {"t": "重试脚本（开源）", "u": "https://github.com/mohankumarpaluru/oracle-freetier-instance-creation"}]};</script>
<script>/* 三个版本共用：模板替换、本地存档、进度汇总、复制。内容在 content.json，构建时内联。 */
(function () {
  var G = window.GUIDE, C = G.config;
  function fill(s) {
    return String(s == null ? "" : s).replace(/\{(\w+)\}/g, function (m, k) {
      if (k === "friend") return C.friend || "你";
      return C[k] != null ? C[k] : m;
    });
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  /* 用本地日期：toISOString 是 UTC，北京时间早上 8 点前会差一天 */
  function today() {
    var d = new Date();
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  var KEY = "oracle-guide:" + (C.storageKey || "default");
  var store = {
    load: function () { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } },
    save: function (s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} },
    clear: function () { try { localStorage.removeItem(KEY); } catch (e) {} }
  };
  function visible(step, answers) {
    if (!step.showIf) return true;
    return Object.keys(step.showIf).every(function (k) { return step.showIf[k].indexOf(answers[k]) >= 0; });
  }
  function option(step, v) {
    for (var i = 0; i < step.options.length; i++) if (step.options[i].v === v) return step.options[i];
    return null;
  }
  function counts(phase, st) {
    var a = st.answers || {}, d = st.done || {}, total = 0, done = 0;
    phase.steps.forEach(function (s) {
      if (!visible(s, a)) return;
      total++;
      if (s.type === "choice" ? a[s.id] : d[s.id]) done++;
    });
    return { done: done, total: total };
  }
  function summary(st) {
    var a = st.answers || {}, lines = [];
    lines.push("【" + G.meta.title + "】" + (C.friend ? C.friend + " " : "") + today());
    G.phases.forEach(function (p, i) {
      var c = counts(p, st);
      if (!c.done) return;
      lines.push("");
      lines.push("第 " + i + " 关 " + fill(p.title) + "（" + c.done + "/" + c.total + "）");
      p.steps.forEach(function (s) {
        if (s.type !== "choice" || !a[s.id]) return;
        var o = option(s, a[s.id]);
        if (!o) return;
        var mark = { ok: "✓", info: "·", warn: "!", stop: "✕" }[o.tone] || "·";
        lines.push(mark + " " + (s.short || fill(s.q)) + "：" + o.label);
      });
    });
    var L = st.ledger || {}, rows = G.ledger.filter(function (f) { return L[f.id]; });
    if (rows.length) {
      lines.push("");
      rows.forEach(function (f) { lines.push(f.label + "：" + L[f.id]); });
    }
    return lines.join("\n");
  }
  /* 先用剪贴板 API；不行就用隐藏文本框（iOS 需要 readonly 加 setSelectionRange 才选得中） */
  function copy(text, done) {
    function fallback() {
      var ta = document.createElement("textarea"), ok = false;
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.style.cssText = "position:absolute;left:-9999px;top:" + (window.pageYOffset || 0) + "px;font-size:12pt;border:0;padding:0;margin:0";
      document.body.appendChild(ta);
      try { ta.select(); ta.setSelectionRange(0, text.length); ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      done(ok);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, fallback);
    } else fallback();
  }
  window.GuideCore = { G: G, C: C, fill: fill, esc: esc, today: today, store: store, visible: visible, option: option, counts: counts, summary: summary, copy: copy };
})();
</script>
<script>
(function(){
var K=GuideCore,G=K.G,C=K.C,f=K.fill,esc=K.esc,$=function(i){return document.getElementById(i)};
var st=K.store.load();st.answers=st.answers||{};st.done=st.done||{};st.ledger=st.ledger||{};
var LABEL={warn:"注意",stop:"先停一下"};
function save(){K.store.save(st)}
function pad(i){return(i<10?"0":"")+i}
function tag(t){return t?'<span class="tag '+t+'">'+esc(f(G.tags[t]))+"</span>":""}
function list(xs){return xs.map(function(x){return"<li>"+esc(f(x))+"</li>"}).join("")}
$("eb").textContent=G.meta.edition+" · "+G.meta.updated;
$("h1").textContent=(C.friend?C.friend+"，":"")+"从零到一台免费服务器";
$("lede").textContent=G.phases.length+" 关，前两关你自己就能做完。每关做完会打上勾，进度存在这个浏览器里。";
$("share").textContent="生成进度，发给 "+C.helper;$("shH").textContent=C.helper;
$("rulesN").textContent=G.rules.length+" 条红线";
$("rules").innerHTML=G.rules.map(function(r){return'<li><span><b>'+esc(f(r.t))+"</b>"+tag(r.tag)+'<span class="d">'+esc(f(r.d))+"</span></span></li>"}).join("");
$("promT").textContent=C.helper+" 会做什么、不会做什么";
$("prom").innerHTML='<div class="duo"><div><h4>会</h4><ul>'+list(G.promise.will)+'</ul></div><div><h4>不会</h4><ul>'+list(G.promise.wont)+'</ul></div></div><p class="foot">'+esc(f(G.promise.after))+"</p>";
$("ldg").innerHTML=G.ledger.map(function(l){return'<label class="lf"><span>'+esc(l.label)+'</span><input data-k="'+l.id+'" placeholder="'+esc(l.ph)+'" value="'+esc(st.ledger[l.id]||"")+'" autocomplete="off"></label>'}).join("");
Array.prototype.forEach.call(document.querySelectorAll("#ldg input"),function(i){i.oninput=function(){st.ledger[i.getAttribute("data-k")]=i.value.trim();save()}});
$("src").innerHTML="<p>标签：「"+esc(f(G.tags.official))+"」有官方原文；「"+esc(f(G.tags.community))+"」来自社区，没有官方说法；「"+esc(f(G.tags.helper))+"」是 "+esc(C.helper)+" 自己的判断。</p><p style=\"margin-top:8px\">依据：</p><ul>"+
  G.sources.map(function(s){return'<li><a href="'+esc(s.u)+'" target="_blank" rel="noopener">'+esc(s.t)+"</a></li>"}).join("")+"</ul>";

var open={},lastCur=null;
function render(){
  var a=st.answers,html="",tot=0,dn=0,cur=-1,segs="";
  var cs=G.phases.map(function(p){return K.counts(p,st)});
  cs.forEach(function(c,i){if(cur<0&&!(c.total&&c.done===c.total))cur=i});
  /* 第一次渲染只展开当前这一关；之后进到新的一关就再展开它，已经展开的不自动收起 */
  if(lastCur===null)G.phases.forEach(function(p,i){open[p.id]=i===cur});
  else if(cur>=0&&cur!==lastCur)open[G.phases[cur].id]=true;
  lastCur=cur;
  G.phases.forEach(function(p,i){
    var c=cs[i],done=c.total&&c.done===c.total,lock=i>C.unlockedPhase,isOpen=!!open[p.id];
    tot+=c.total;dn+=c.done;
    segs+='<span class="sg'+(lock?" lock":"")+'"><i style="width:'+(c.total?Math.round(c.done/c.total*100):0)+'%"></i></span>';
    var cls=done?"done":i===cur?"now":lock?"lock":"";
    html+='<li class="phase '+cls+(isOpen?" open":"")+'" data-p="'+p.id+'"><span class="node" data-n="'+pad(i)+'" aria-hidden="true"><i>'+(done?"✓":i)+"</i></span>"+
      '<div class="ph"><button class="ph-h" type="button" aria-expanded="'+isOpen+'" aria-controls="b-'+p.id+'"><span class="ph-t"><b><span class="sr">第 '+i+" 关：</span>"+esc(f(p.title))+(i===cur?'<span class="nowl">进行中</span>':"")+"</b><span>"+esc(f(p.who))+" · "+esc(p.time)+"</span></span>"+
      '<span class="meta">'+(done?"完成":c.done+" / "+c.total)+"</span></button>"+
      '<div class="ph-b" id="b-'+p.id+'"><p class="intro">'+esc(f(p.intro))+"</p>"+(lock?'<p class="locknote">这一关到时候 '+esc(C.helper)+" 带你做，现在先看看就好。</p>":"");
    p.steps.forEach(function(s){if(!K.visible(s,a))return;
      if(s.type==="choice"){
        var o=a[s.id]?K.option(s,a[s.id]):null;
        html+='<div class="q" role="group" aria-labelledby="q-'+s.id+'"><p class="q-t" id="q-'+s.id+'">'+esc(f(s.q))+"</p>"+(s.hint?'<p class="q-h">'+esc(f(s.hint))+"</p>":"")+'<div class="opts">'+
          s.options.map(function(x){return'<button type="button" class="opt" data-s="'+s.id+'" data-v="'+x.v+'" aria-pressed="'+(a[s.id]===x.v)+'">'+esc(x.label)+"</button>"}).join("")+"</div>"+
          (o?'<p class="reply">'+(LABEL[o.tone]?'<b class="tl t-'+o.tone+'">'+LABEL[o.tone]+"</b>":"")+esc(f(o.reply))+"</p>":"")+"</div>";
      }else{
        html+='<label class="ck"><input type="checkbox" data-t="'+s.id+'"'+(st.done[s.id]?" checked":"")+(lock?" disabled":"")+"><span><b>"+esc(f(s.title))+"</b>"+tag(s.tag)+
          (s.how.length?"<ol>"+s.how.map(function(h){return"<li>"+esc(f(h))+"</li>"}).join("")+"</ol>":"")+"</span></label>";
      }});
    html+="</div></div></li>";
  });
  /* 重画前记住焦点，重画后放回去，键盘用户不会丢位置 */
  var ae=document.activeElement,key=null;
  if(ae&&$("tl").contains(ae)){
    if(ae.getAttribute("data-s"))key='.opt[data-s="'+ae.getAttribute("data-s")+'"][data-v="'+ae.getAttribute("data-v")+'"]';
    else if(ae.getAttribute("data-t"))key='input[data-t="'+ae.getAttribute("data-t")+'"]';
    else if(ae.classList.contains("ph-h"))key='[data-p="'+ae.closest(".phase").getAttribute("data-p")+'"] .ph-h';
  }
  $("tl").innerHTML=html;
  if(key){var el=document.querySelector(key);if(el)try{el.focus({preventScroll:true})}catch(e){}}
  var pct=tot?Math.round(dn/tot*100):0;
  $("segs").innerHTML=segs;
  $("prog").setAttribute("aria-valuenow",pct);
  $("prog").setAttribute("aria-label","总进度 "+pct+"%");
  $("progT").innerHTML=cur<0?"<b>全部完成</b>":"进行到 <b>第 "+cur+" 关</b> · 总进度 "+pct+"%";
}
$("tl").addEventListener("click",function(e){
  var h=e.target.closest(".ph-h");
  if(h){var li=h.closest(".phase"),id=li.getAttribute("data-p");open[id]=!li.classList.contains("open");li.classList.toggle("open",open[id]);h.setAttribute("aria-expanded",open[id]);return}
  var o=e.target.closest(".opt");
  if(o){var sid=o.getAttribute("data-s");st.answers[sid]=o.getAttribute("data-v");save();render();
    var q=document.getElementById("q-"+sid),r=q&&q.parentNode.querySelector(".reply");
    if(r){var lv=$("live");lv.textContent="";setTimeout(function(){lv.textContent=r.textContent},80);
      if(r.scrollIntoView)r.scrollIntoView({block:"nearest",behavior:"smooth"})}}
});
$("tl").addEventListener("change",function(e){var t=e.target.getAttribute("data-t");if(!t)return;st.done[t]=e.target.checked;save();render()});
var back=null;
function openSheet(){back=document.activeElement;$("sum").textContent=K.summary(st);$("sheet").hidden=false;document.documentElement.classList.add("lock");$("copy").focus()}
function closeSheet(){$("sheet").hidden=true;document.documentElement.classList.remove("lock");if(back&&back.focus)back.focus()}
$("share").onclick=openSheet;
$("close").onclick=closeSheet;
$("sheet").onclick=function(e){if(e.target===this)closeSheet()};
document.addEventListener("keydown",function(e){
  if($("sheet").hidden)return;
  if(e.key==="Escape"){closeSheet();return}
  if(e.key==="Tab"){var fs=[$("close"),$("copy")],i=fs.indexOf(document.activeElement);
    if(e.shiftKey&&i<=0){e.preventDefault();fs[fs.length-1].focus()}else if(!e.shiftKey&&i===fs.length-1){e.preventDefault();fs[0].focus()}}
});
$("copy").onclick=function(){var b=this;K.copy($("sum").textContent,function(ok){b.textContent=ok?"已复制":"复制失败，请长按";setTimeout(function(){b.textContent="复制"},2000)})};
var rt;
$("reset").onclick=function(){var b=this;
  if(b.hasAttribute("data-arm")){K.store.clear();location.reload();return}
  b.setAttribute("data-arm","");b.textContent="再点一次";clearTimeout(rt);rt=setTimeout(function(){b.removeAttribute("data-arm");b.textContent="清空"},2500)};
render();
})();
</script>
</body>
</html>
