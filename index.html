<title>Oracle 上手问答</title>
<style>
/* 只有一种外观：深色、彩色，不跟随系统的深浅色（2026-11-20 定）。颜色都在这几个变量里。 */
:root{
  --bg:#171411;--surface:#25211D;--ink:#F1EAE1;--muted:#ADA092;--line:#3A332C;
  --accent:#E3825B;--accent-ink:#1A1512;--me:#EDE5DA;--me-ink:#1A1512;--focus:#93BBE8;
  --ok:#86CFA2;--info:#93BBE8;--warn:#E9B867;--stop:#F09189;
  --r:18px;--r-tail:6px;--r-ctl:12px;--r-card:16px;--r-av:50%;--r-box:6px;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
p{margin:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
.app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}

header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));
  background:var(--bg);border-bottom:1px solid var(--line)}
.av{flex:none;width:36px;height:36px;border-radius:var(--r-av);background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:16px}
.who{flex:1;min-width:0}
.who b{display:block;font-size:16px;font-weight:600;line-height:1.3}
.who>span{display:block;font-size:13px;line-height:1.45;color:var(--muted)}
.nw{white-space:nowrap}
.restart{flex:none;min-height:44px;min-width:44px;padding:0 2px 0 10px;border:0;background:none;color:var(--muted);font-size:14px;cursor:pointer}
.restart[data-arm]{color:var(--stop);font-weight:600}

main{flex:1;padding:14px max(16px,env(safe-area-inset-right)) 18px max(16px,env(safe-area-inset-left))}
.msg{display:flex;margin:8px 0}
.msg.ask{margin-top:18px}
.bubble{max-width:86%;padding:10px 14px;border-radius:var(--r);background:var(--surface);overflow-wrap:anywhere}
.bubble p+p{margin-top:6px}
.bot .bubble{border-top-left-radius:var(--r-tail)}
.bubble.wide{max-width:100%;width:100%}
.bubble.bare{padding:0;background:none}
.me{justify-content:flex-end}
.me .bubble{display:flex;align-items:baseline;gap:10px;border:0;background:var(--me);color:var(--me-ink);border-top-right-radius:var(--r-tail);text-align:left;cursor:pointer}
.me .edit{flex:none;font-size:12px;opacity:.75;text-decoration:underline;text-underline-offset:3px}
.step{font-size:12px;color:var(--muted);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.q{margin-top:2px;font-weight:600;font-size:17px;line-height:1.45}
.hint{margin-top:6px;color:var(--muted);font-size:14px;line-height:1.6}
.tl{font-weight:650;color:var(--c);margin-right:6px}
.t-ok{--c:var(--ok)}.t-info{--c:var(--info)}.t-warn{--c:var(--warn)}.t-stop{--c:var(--stop)}
.tag{display:inline-block;margin-left:6px;padding:0 6px;font-size:11px;font-weight:500;line-height:18px;letter-spacing:.02em;
  color:var(--muted);border:1px solid var(--line);border-radius:4px;vertical-align:2px;white-space:nowrap}
.tag.official{color:var(--info)}
h3{margin:0 0 4px;font-size:16px;font-weight:600;line-height:1.45}
ol,ul{margin:6px 0 2px;padding-left:20px}
li{margin:3px 0}

details.rd{margin-top:10px;border-top:1px solid var(--line)}
details.rd summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;min-height:44px;font-weight:600;color:var(--accent)}
details.rd summary::-webkit-details-marker{display:none}
details.rd summary::after{content:"";width:6px;height:6px;border:solid currentColor;border-width:0 1.5px 1.5px 0;transform:translateY(-2px) rotate(45deg);transition:transform .2s}
details.rd[open] summary::after{transform:translateY(1px) rotate(-135deg)}
.rules{list-style:none;margin:0 0 4px;padding:0;counter-reset:r}
.rules li{counter-increment:r;display:grid;grid-template-columns:20px 1fr;gap:6px;margin:0;padding:8px 0;border-top:1px solid var(--line)}
.rules li::before{content:counter(r);font-weight:650;color:var(--accent);font-variant-numeric:tabular-nums}
.rules b{font-weight:600}
.rules .d{display:block;color:var(--muted);font-size:14px}

.check{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.check input{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;margin:2px 0 0;border:1.5px solid var(--muted);border-radius:var(--r-box);display:grid;place-items:center;background:var(--surface);cursor:pointer}
.check input:checked{background:var(--ink);border-color:var(--ink)}
.check input:checked::after{content:"";width:5px;height:10px;border:solid var(--surface);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.check b{font-weight:600}
.check .cd{display:block;font-size:14px;color:var(--muted)}
.count{margin-top:2px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden}
.card-h{padding:16px 18px 14px;border-bottom:1px solid var(--line)}
.card-m{display:flex;justify-content:space-between;gap:12px;font-size:12px;letter-spacing:.04em;color:var(--muted);font-variant-numeric:tabular-nums}
.card-h b{display:block;margin-top:6px;font-size:20px;font-weight:650;line-height:1.35}
.verdict{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--c)}
.verdict::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:currentColor}
.rows{list-style:none;margin:0;padding:2px 18px}
.rows li{display:grid;grid-template-columns:5.6em minmax(0,1fr) auto;gap:12px;align-items:baseline;margin:0;padding:10px 0;border-top:1px solid var(--line);font-size:15px;line-height:1.5}
.rows li:first-child{border-top:0}
.rows .k{color:var(--muted);font-size:14px}
.rows .w{font-size:13px;font-weight:600;color:var(--c);white-space:nowrap}
.card-f{padding:12px 18px 16px;border-top:1px solid var(--line)}
.card-fm{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.card-fm b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.seg{display:flex;gap:4px;margin-top:8px}
.seg i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.seg i.on{background:var(--ink)}

.road{list-style:none;margin:6px 0 0;padding:0}
.road li{display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:10px;align-items:baseline;margin:0;padding:9px 0;border-top:1px solid var(--line)}
.road li:first-child{border-top:0}
.road .n{font-size:14px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.road .rt b{display:block;font-weight:600;line-height:1.4}
.road .rt span{display:block;font-size:13px;color:var(--muted)}
.road .rs{font-size:13px;color:var(--muted);white-space:nowrap}
.road .now .n,.road .now .rs{color:var(--accent);font-weight:600}
.road .done .n,.road .done .rs{color:var(--ok)}
.road .lock .rt b{color:var(--muted);font-weight:500}

.dock{position:sticky;bottom:0;z-index:5;padding:10px max(16px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:var(--bg);border-top:1px solid var(--line)}
.dock:empty{display:none}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;margin:8px 0 0;padding:12px 16px;text-align:left;line-height:1.4;font-size:16px;
  border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--surface);cursor:pointer}
.opt:first-child{margin-top:0}
.opt:active{background:var(--line)}
@media (hover:hover){.opt:hover{border-color:var(--muted)}}
.opt.primary{justify-content:center;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.opt.primary:active{opacity:.85}

.new{animation:rise .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast{position:fixed;left:50%;top:calc(72px + env(safe-area-inset-top));transform:translateX(-50%);max-width:calc(100% - 32px);padding:10px 16px;border-radius:12px;background:var(--me);color:var(--me-ink);font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.noscript{margin:24px 16px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
@media (prefers-reduced-motion:reduce){.new{animation:none}*{transition:none!important}}
</style>
</head>

", "reply": "{helper} 建议选 {region}。{regionWhy}。"}, {"v": "cn", "label": "主要在国内", "tone": "info", "reply": "告诉 {helper}，区域要另外商量。"}, {"v": "other", "label": "别的地方，或还不确定", "tone": "info", "reply": "不确定就按 {region}。知道以后会长住哪里的话，先告诉 {helper} 再定。"}], "short": "以后在哪用"}, {"id": "email", "type": "choice", "q": "注册打算用哪个邮箱？", "hint": "一个邮箱只能对应一个 Oracle 账号。以后 Oracle 的重要通知都发到这里。", "options": [{"v": "fresh", "label": "从没注册过 Oracle 的邮箱", "tone": "ok", "reply": "好。确认人在国内时也能收信：Gmail 在国内打不开，Outlook 和 iCloud 邮箱一般直接能收。"}, {"v": "used", "label": "用来注册过 Oracle 的邮箱", "tone": "warn", "reply": "那很可能已经有账号了。回到第一题，按「不确定」的方法查一下。"}], "short": "邮箱"}]}, {"id": "p1", "title": "准备好东西", "who": "你自己", "time": "30 分钟", "intro": "注册前一天准备好。每样准备好就勾上。", "steps": [{"id": "c-card", "type": "task", "title": "卡", "how": ["本人名字的信用卡（优先），或刷卡不用输 PIN 的借记卡。", "在有效期内，网上支付已开通。"], "tag": "official"}, {"id": "c-sca", "type": "task", "title": "银行确认能用", "how": ["银行 App 能登录、能收推送；或者手机能收短信。"]}, {"id": "c-addr", "type": "task", "title": "地址", "how": ["和这张卡在银行登记的地址一致，带邮编。"], "tag": "community"}, {"id": "c-email", "type": "task", "title": "邮箱", "how": ["没注册过 Oracle，人在哪里都能收信，记得密码。"]}, {"id": "c-phone", "type": "task", "title": "手机号", "how": ["填你自己的号码，和地址在同一页。", "Oracle 官方的注册步骤里没有短信验证码这一步。"], "tag": "official"}, {"id": "c-auth", "type": "task", "title": "验证器 App", "how": ["第一次登录 Oracle 必须绑定验证器，以后每次登录都要用。", "装 Oracle Mobile Authenticator，或任何能生成 6 位动态码的 App（官方举例 Google Authenticator）。先确认手机的应用商店里下得到。"], "tag": "official"}, {"id": "c-pc", "type": "task", "title": "电脑", "how": ["用你自己的电脑注册，不用手机。浏览器用最新版的 Chrome、Edge 或 Safari。"]}, {"id": "c-net", "type": "task", "title": "网络", "how": ["关掉 VPN 和所有代理。人在国内就用手机热点。"], "tag": "community"}, {"id": "c-name", "type": "task", "title": "想好账号名", "how": ["Cloud Account Name，以后登录要用。用小写英文字母和数字，页面会提示具体规则。"]}, {"id": "c-call", "type": "task", "title": "约时间", "how": ["和 {helper} 约 30 分钟，视频通话共享屏幕，一起注册。"]}]}, {"id": "p2", "title": "注册账号", "who": "你操作，{helper} 视频陪着", "time": "20 到 30 分钟", "intro": "全程用你自己的电脑和网络。{helper} 只看屏幕、告诉你点哪里。", "steps": [{"id": "s-open", "type": "task", "title": "打开注册页", "how": ["打开 signup.oraclecloud.com（或者 oracle.com/cloud/free，点 Start for free）。"], "tag": "official"}, {"id": "s-basic", "type": "task", "title": "基本信息", "how": ["国家选 Italy，名字按卡上的拼写填，填邮箱。", "点 I am human 过人机验证，再点 Verify my email。", "30 分钟内去邮箱点确认链接，过期要重发。"], "tag": "official"}, {"id": "s-region", "type": "task", "title": "账号名、密码、主区域", "how": ["设密码，起账号名（Cloud Account Name）。", "主区域（Home Region）选 {region}。选了就永远不能改，点之前和 {helper} 再对一遍。"], "tag": "official"}, {"id": "s-addr", "type": "task", "title": "地址和手机号", "how": ["和第 1 关准备的一致。"], "tag": "official"}, {"id": "s-pay", "type": "task", "title": "加卡", "how": ["点 Add payment verification method，选 Credit Card，填卡，点 Finish。", "银行可能让你在 App 或短信里确认一下，确认就行。这是 1 美元左右的验证预授权，不是扣款。"], "tag": "official"}, {"id": "s-done", "type": "task", "title": "同意条款，提交", "how": ["勾选同意条款，点 Start my free trial。", "等 Oracle 发账号开通的邮件，可能要几分钟到几小时。这封邮件里有账号名，留好。"], "tag": "community"}, {"id": "s-mfa", "type": "task", "title": "第一次登录：绑验证器、存备用码", "how": ["按提示点 Enable Secure Verification，选 Mobile App，用验证器扫码。用的不是 Oracle 自己的 App 时，选 Offline Mode or Use Another Authenticator App。", "绑好马上生成备用码：右上角头像，User settings，Security，Bypass codes，Generate。抄在纸上，或存进密码管理器。", "手机丢了只能找 Oracle 在线客服重置，不保证成功，所以备用码一定要存。"], "tag": "official"}, {"id": "s-trial", "type": "task", "title": "知道试用期是怎么回事", "how": ["前 30 天送 300 美元试用额度。这期间只开免费的东西。", "30 天后，用额度开的收费资源会被 Oracle 收回；免费的机器不受影响。不升级，卡就不会被扣钱。"], "tag": "official"}, {"id": "s-fail", "type": "task", "title": "如果被拒", "how": ["把页面提示截图发给 {helper}。最多试两次，不换卡、不换邮箱反复试。"]}]}, {"id": "p3", "title": "开第一台小机器", "who": "{helper} 带你做", "time": "15 分钟", "intro": "先开一台免费的小机器（1 GB 内存）。它马上就能用；后面自动抢 ARM 机的脚本也在这台上跑，用的是你自己的账号和 IP。", "steps": [{"id": "m-shape", "type": "task", "title": "选机型", "how": ["Compute，Instances，Create instance。", "Shape 选 VM.Standard.E2.1.Micro，系统选 Ubuntu 24.04。"]}, {"id": "m-net", "type": "task", "title": "网络", "how": ["新建 VCN 和公网子网，勾选分配公网 IPv4。"]}, {"id": "m-key", "type": "task", "title": "SSH 钥匙", "how": ["在你电脑上生成一对钥匙，{helper} 会给你一条命令。私钥留在你电脑上。", "SSH keys 那一栏选上传公钥文件，按住 Command（Mac）或 Ctrl（Windows），同时选你的公钥和 {helper} 发来的临时公钥（都是 .pub 文件）。"], "tag": "official"}, {"id": "m-disk", "type": "task", "title": "硬盘用默认大小", "how": ["不要调大。免费的硬盘一共 200 GB，要给 ARM 机留空间。"], "tag": "official"}]}, {"id": "p4", "title": "手动试一次 ARM 机", "who": "你自己", "time": "5 分钟", "intro": "运气好的话手动就能建成，后面就不用等了。", "steps": [{"id": "a-try", "type": "task", "title": "建一台", "how": ["Create instance，Shape 选 Ampere 下的 VM.Standard.A1.Flex，调成 2 OCPU、12 GB 内存。", "系统选 Ubuntu 24.04 aarch64，网络选刚才那个 VCN 和公网子网。"], "tag": "official"}, {"id": "a-ad", "type": "task", "title": "三个可用区都试一遍", "how": ["提示 Out of capacity（没货）很正常。换一个 AD（可用区）再点，三个都试一遍。", "真建成了就截图告诉 {helper}。"]}]}, {"id": "p5", "title": "让脚本自动抢", "who": "{helper} 来做，你做一步", "time": "几天到几周", "intro": "脚本每 3 分钟替你点一次「创建」，抢到为止。", "steps": [{"id": "r-setup", "type": "task", "title": "{helper} 装脚本", "how": ["{helper} 登录你的小机器，装好开源的重试脚本。"]}, {"id": "r-api", "type": "task", "title": "你加一把 API 公钥", "how": ["右上角头像，User settings（有的版本叫 My profile），Tokens and keys，Add API key，选 Paste a public key，贴 {helper} 发来的公钥，点 Add。菜单名字在不同版本里不太一样，到时候共享屏幕找。", "把弹出的配置预览复制给 {helper}，里面没有密码和私钥。"], "tag": "official"}, {"id": "r-wait", "type": "task", "title": "等", "how": ["{helper} 上次自己抢用了约 8 天（那个区域只有 1 个可用区）。", "等的时候不要动这台小机器和网络。超过 4 周还没抢到，一起商量要不要停。"]}]}, {"id": "p6", "title": "抢到当天", "who": "一起做", "time": "15 分钟", "intro": "当天做完，不拖。", "steps": [{"id": "d-check", "type": "task", "title": "确认真的有了", "how": ["Compute，Instances 里看到新的 ARM 机，状态 Running，能登录。"]}, {"id": "d-stop", "type": "task", "title": "{helper} 停掉脚本", "how": []}, {"id": "d-api", "type": "task", "title": "你删掉 API 公钥", "how": ["回到同一个页面，勾选那把钥匙，Delete，确认。"], "tag": "official"}, {"id": "d-ssh", "type": "task", "title": "{helper} 删掉自己的 SSH 公钥", "how": ["两台机器上都删，共享屏幕给你看。"]}, {"id": "d-micro", "type": "task", "title": "小机器留不留", "how": ["小机器也免费，可以留着用，也可以删掉。"]}]}, {"id": "p7", "title": "长期保持", "who": "你自己，偶尔看看", "time": "每月 5 分钟", "intro": "免费的机器会被回收，账号丢了也没人能帮你找回，所以要照顾一下。", "steps": [{"id": "k-idle", "type": "task", "title": "机器别闲着", "how": ["连续 7 天 CPU、网络、内存都用得很少的免费机器会被 Oracle 回收。", "{helper} 会放一个占资源很少的常驻程序；你自己用起来更好。"], "tag": "official"}, {"id": "k-login", "type": "task", "title": "每月登录一次", "how": ["登录控制台看一眼，留意 Oracle 的邮件，尤其是说要停用或回收的。", "Oracle 没有说清怎样算在用，每月登录是保险做法。"], "tag": "helper"}, {"id": "k-keep", "type": "task", "title": "存好这几样", "how": ["账号名、密码、验证器备用码、SSH 私钥。", "免费账号不能提交工单，验证器丢了只能找在线客服重置，不保证成功。"], "tag": "official"}, {"id": "k-pay", "type": "task", "title": "不升级、不开收费的东西", "how": ["ARM 机在控制台可能不显示 Always Free 标志，{helper} 的那台也是这样，含义还没查清，升级前务必先问。"], "tag": "helper"}]}], "ledger": [{"id": "l-date", "label": "注册日期", "ph": "例如 2026-12-05"}, {"id": "l-region", "label": "主区域", "ph": "例如 Frankfurt"}, {"id": "l-name", "label": "账号名", "ph": "Cloud Account Name"}, {"id": "l-micro", "label": "小机器建好", "ph": "日期"}, {"id": "l-run", "label": "脚本开始", "ph": "日期"}, {"id": "l-got", "label": "抢到", "ph": "日期"}, {"id": "l-note", "label": "备注", "ph": "不要写密码"}], "sources": [{"t": "Oracle：Always Free 资源说明", "u": "https://docs.oracle.com/en-us/iaas/Content/FreeTier/freetier_topic-Always_Free_Resources.htm"}, {"t": "Oracle：Free Tier 说明（试用额度、不升级不扣款）", "u": "https://docs.oracle.com/iaas/Content/FreeTier/freetier.htm"}, {"t": "Oracle：注册步骤", "u": "https://docs.oracle.com/en-us/iaas/Content/GSG/Tasks/signingup_topic-Sign_Up_for_Free_Oracle_Cloud_Promotion.htm"}, {"t": "Oracle：第一次登录与验证器", "u": "https://docs.oracle.com/iaas/Content/GSG/Tasks/signingin_topic-Signing_In_for_the_First_Time.htm"}, {"t": "Oracle：第三方验证器 App", "u": "https://docs.oracle.com/en-us/iaas/Content/Identity/mfa/learn-using-mobile-authenticator-app-mfa.htm"}, {"t": "Oracle：生成备用码", "u": "https://docs.oracle.com/en-us/iaas/Content/Identity/usersettings/generate-bypass-code.htm"}, {"t": "Oracle：卡的预授权与升级", "u": "https://docs.oracle.com/iaas/Content/Billing/Tasks/changingpaymentmethod.htm"}, {"t": "Oracle：区域与可用区", "u": "https://docs.oracle.com/en-us/iaas/Content/General/Concepts/regions.htm"}, {"t": "重试脚本（开源）", "u": "https://github.com/mohankumarpaluru/oracle-freetier-instance-creation"}]};</script>
<script>/* 页面用的工具：模板替换、本地存档、进度汇总、复制。内容在 content.json，构建时内联。 */
(function () {
  var G = window.GUIDE, C = G.config;
  function fill(s) {
    return String(s == null ? "" : s).replace(/\{(\w+)\}/g, function (m, k) {
      if (k === "friend") return C.friend || "你";
      return C[k] != null ? C[k] : m;
    });
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  /* 用本地日期：toISOString 是 UTC，北京时间早上 8 点前会差一天 */
  function today() {
    var d = new Date();
    function p(n) { return (n < 10 ? "0" : "") + n; }
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }
  var KEY = "oracle-guide:" + (C.storageKey || "default");
  var store = {
    load: function () { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } },
    save: function (s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} },
    clear: function () { try { localStorage.removeItem(KEY); } catch (e) {} }
  };
  function visible(step, answers) {
    if (!step.showIf) return true;
    return Object.keys(step.showIf).every(function (k) { return step.showIf[k].indexOf(answers[k]) >= 0; });
  }
  function option(step, v) {
    for (var i = 0; i < step.options.length; i++) if (step.options[i].v === v) return step.options[i];
    return null;
  }
  function counts(phase, st) {
    var a = st.answers || {}, d = st.done || {}, total = 0, done = 0;
    phase.steps.forEach(function (s) {
      if (!visible(s, a)) return;
      total++;
      if (s.type === "choice" ? a[s.id] : d[s.id]) done++;
    });
    return { done: done, total: total };
  }
  function summary(st) {
    var a = st.answers || {}, lines = [];
    lines.push("【" + G.meta.title + "】" + (C.friend ? C.friend + " " : "") + today());
    G.phases.forEach(function (p, i) {
      var c = counts(p, st);
      if (!c.done) return;
      lines.push("");
      lines.push("第 " + i + " 关 " + fill(p.title) + "（" + c.done + "/" + c.total + "）");
      p.steps.forEach(function (s) {
        if (s.type !== "choice" || !a[s.id]) return;
        var o = option(s, a[s.id]);
        if (!o) return;
        var mark = { ok: "✓", info: "·", warn: "!", stop: "✕" }[o.tone] || "·";
        lines.push(mark + " " + (s.short || fill(s.q)) + "：" + o.label);
      });
    });
    var L = st.ledger || {}, rows = G.ledger.filter(function (f) { return L[f.id]; });
    if (rows.length) {
      lines.push("");
      rows.forEach(function (f) { lines.push(f.label + "：" + L[f.id]); });
    }
    return lines.join("\n");
  }
  /* 先在点击里同步用隐藏文本框复制，不行再用剪贴板 API。
     顺序是 2026-11-20 按调研定的：安卓微信里剪贴板 API 常报 NotAllowedError，原来先 API 再文本框，
     文本框就落到异步回调里、离开了点击；iOS 的文本框要 readonly 加 setSelectionRange 才选得中。 */
  function copy(text, done) {
    var ta = document.createElement("textarea"), ok = false;
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:absolute;left:-9999px;top:" + (window.pageYOffset || 0) + "px;font-size:12pt;border:0;padding:0;margin:0";
    document.body.appendChild(ta);
    try { ta.select(); ta.setSelectionRange(0, text.length); ok = document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
    if (ok) return done(true);
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { done(true); }, function () { done(false); });
    } else done(false);
  }
  window.GuideCore = { G: G, C: C, fill: fill, esc: esc, today: today, store: store, visible: visible, option: option, counts: counts, summary: summary, copy: copy };
})();
</script>
<script>
(function(){
var K=GuideCore,G=K.G,C=K.C,f=K.fill,esc=K.esc;
function $(i){return document.getElementById(i)}
var st=K.store.load();st.answers=st.answers||{};st.done=st.done||{};
var log=$("log"),dock=$("dock"),live=$("live");
var reduce=!!(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches);
var prev=-1,viaKey=false,cardEl=null;
var LABEL={warn:"注意",stop:"先停一下"};
var WORD={ok:"可以",info:"提示",warn:"注意",stop:"先停"};
$("av").textContent=(C.helper||"K").charAt(0).toUpperCase();
$("name").textContent=C.helper;
$("sub").innerHTML='Oracle 免费服务器 · <span class="nw">自查约 10 分钟</span>';
log.setAttribute("aria-label","和 "+C.helper+" 的对话");
function save(){K.store.save(st)}
function pad(i){return(i<10?"0":"")+i}
function node(cls,html,bcls,tagName){var m=document.createElement("div");m.className="msg "+cls;
  var b=document.createElement(tagName||"div");b.className="bubble "+(bcls||"");b.innerHTML=html;m.appendChild(b);return m}
function tag(t){return t?'<span class="tag '+t+'">'+esc(f(G.tags[t]))+"</span>":""}
function me(text,undo){
  var m=node("me",'<span>'+esc(text)+'</span><span class="edit" aria-hidden="true">改</span>',"","button"),b=m.firstChild;
  b.type="button";b.setAttribute("aria-label","改这一题，现在选的是："+text);
  b.onclick=function(e){viaKey=e.detail===0;undo();st.card=false;save();render({toEnd:true})};return m}
function rules(){return '<details class="rd"><summary>开始前，先看 '+G.rules.length+' 条红线</summary><ol class="rules">'+G.rules.map(function(r){
  return "<li><span><b>"+esc(f(r.t))+"</b>"+tag(r.tag)+'<span class="d">'+esc(f(r.d))+"</span></span></li>"}).join("")+"</ol></details>"}
function task(s){return "<h3>"+esc(f(s.title))+tag(s.tag)+"</h3><ol>"+s.how.map(function(h){return "<li>"+esc(f(h))+"</li>"}).join("")+"</ol>"}
function swapCard(){if(!st.card||!cardEl||!cardEl.parentNode)return;var c=card();cardEl.parentNode.replaceChild(c,cardEl);cardEl=c}
function checklist(p){
  var m=node("bot","<h3>第 1 关 · "+esc(f(p.title))+'</h3><p class="hint">'+esc(f(p.intro))+"</p>","wide"),b=m.firstChild,cnt=document.createElement("p");cnt.className="count";
  p.steps.forEach(function(s){
    var l=document.createElement("label");l.className="check";
    l.innerHTML='<input type="checkbox" data-t="'+s.id+'"'+(st.done[s.id]?" checked":"")+'><span><b>'+esc(f(s.title))+"</b>"+tag(s.tag)+'<span class="cd">'+esc(f(s.how.join(" ")))+"</span></span>";
    l.firstChild.onchange=function(){st.done[s.id]=this.checked;save();upd();swapCard()};
    b.appendChild(l)});
  function upd(){var c=K.counts(p,st);cnt.textContent="已准备 "+c.done+" / "+c.total+(c.done===c.total?"，可以约 "+C.helper+" 注册了":"")}
  upd();b.appendChild(cnt);return m}
function card(){
  var a=st.answers,rows=[],n={ok:0,info:0,warn:0,stop:0};
  G.phases[0].steps.forEach(function(s){if(s.type!=="choice"||!K.visible(s,a)||!a[s.id])return;
    var o=K.option(s,a[s.id]);if(!o)return;n[o.tone]++;
    rows.push('<li class="t-'+o.tone+'"><span class="k">'+esc(s.short||f(s.q))+'</span><span class="v">'+esc(o.label)+'</span><span class="w">'+WORD[o.tone]+"</span></li>")});
  var v=n.stop?["stop","有 "+n.stop+" 项要先解决"]:n.warn?["warn","有 "+n.warn+" 项要先确认"]:n.info?["info","都没问题，有 "+n.info+" 条要记住"]:["ok","都没问题，可以准备注册"];
  var c1=K.counts(G.phases[1],st),seg="";for(var i=0;i<c1.total;i++)seg+="<i"+(i<c1.done?' class="on"':"")+"></i>";
  return node("bot",'<section class="card" aria-label="自查卡"><div class="card-h"><div class="card-m"><span>自查卡</span><span>'+K.today()+"</span></div><b>"+(C.friend?esc(C.friend)+" 的":"我的")+' Oracle 准备情况</b><p class="verdict t-'+v[0]+'">'+v[1]+'</p></div><ul class="rows">'+rows.join("")+'</ul><div class="card-f"><div class="card-fm"><span>第 1 关准备</span><b>'+c1.done+" / "+c1.total+'</b></div><div class="seg" aria-hidden="true">'+seg+"</div></div></section>","wide bare")}
function road(){var cur=-1;
  var items=G.phases.map(function(p,i){var c=K.counts(p,st),cls=c.total&&c.done===c.total?"done":"";
    if(!cls&&cur<0){cur=i;cls="now"}else if(!cls&&i>C.unlockedPhase)cls="lock";
    var rs=cls==="done"?"完成":cls==="now"?"现在":"";
    return '<li class="'+cls+'"><span class="n">'+pad(i)+'</span><span class="rt"><b>'+esc(f(p.title))+"</b><span>"+esc(f(p.who))+" · "+esc(p.time)+"</span></span>"+(rs?'<span class="rs">'+rs+"</span>":"<span></span>")+"</li>"});
  return '<h3>整条路线</h3><ol class="road">'+items.join("")+"</ol>"}
function promise(){var P=G.promise;return "<h3>"+esc(C.helper)+" 会做什么</h3><ul>"+P.will.map(function(x){return"<li>"+esc(f(x))+"</li>"}).join("")+
  '</ul><h3 style="margin-top:12px">不会做什么</h3><ul>'+P.wont.map(function(x){return"<li>"+esc(f(x))+"</li>"}).join("")+'</ul><p class="hint">'+esc(f(P.after))+"</p>"}
function render(opt){
  opt=opt||{};
  var n=[],a=st.answers,acts=null,p0=G.phases[0],choices=p0.steps.filter(function(s){return s.type==="choice"}),qi=0,stop=false;
  cardEl=null;
  n.push(node("bot hello","<p>你好"+(C.friend?" "+esc(C.friend):"")+"，我是 "+esc(C.helper)+"。</p><p>想拿一台 Oracle 的免费服务器，我们一步一步来。先回答几个问题，点下面的选项就行。</p>"+rules(),"wide"));
  for(var i=0;i<p0.steps.length;i++){var s=p0.steps[i];if(!K.visible(s,a))continue;
    if(s.type==="choice"){qi++;
      n.push(node("bot ask",'<p class="step">第 '+qi+" / "+choices.length+' 题</p><p class="q">'+esc(f(s.q))+"</p>"+(s.hint?'<p class="hint">'+esc(f(s.hint))+"</p>":"")));
      var o=a[s.id]?K.option(s,a[s.id]):null;
      if(!o){acts=s.options.map(function(o){return{label:o.label,go:function(){a[s.id]=o.v;save();render()}}});stop=true;break}
      n.push(me(o.label,(function(id){return function(){delete a[id]}})(s.id)));
      n.push(node("bot reply",(LABEL[o.tone]?'<b class="tl t-'+o.tone+'">'+LABEL[o.tone]+"</b>":"")+esc(f(o.reply))));
    }else{
      n.push(node("bot",task(s),"wide"));
      if(!st.done[s.id]){acts=[{label:"看完了，继续",go:function(){st.done[s.id]=true;save();render()}}];stop=true;break}
      n.push(me("看完了",(function(id){return function(){delete st.done[id]}})(s.id)));
    }}
  if(!stop){
    n.push(node("bot","第 0 关做完了。下面是第 1 关：注册前要准备的东西。准备好一样勾一样，过几天回来接着勾也行，进度存在这个浏览器里。"));
    n.push(checklist(G.phases[1]));
    if(!st.card)acts=[{label:"生成我的小卡片",cls:"primary",go:function(){st.card=true;save();render()}}];
    else{
      n.push(node("bot",road(),"wide"));n.push(node("bot",promise(),"wide"));
      n.push(node("bot","最后，截图下面这张卡片发给 "+esc(C.helper)+"，或者点「复制文字」，再到微信里粘贴。"));
      cardEl=card();n.push(cardEl);
      acts=[{label:"复制文字，发给 "+C.helper,cls:"primary",go:function(){K.copy(K.summary(st),function(ok){toast(ok?"已复制，去微信粘贴":"复制失败，请直接截图")})}}];
    }}
  var first=prev<0;if(first)prev=n.length-1;
  log.innerHTML="";var fresh=0,said=[];
  n.forEach(function(x,i){
    if(!first&&i>=prev){if(!reduce){x.classList.add("new");x.style.animationDelay=(fresh*0.18)+"s"}fresh++;if(x.classList.contains("bot"))said.push(x.textContent)}
    log.appendChild(x)});
  var grew=n.length>prev;prev=n.length;
  dock.innerHTML="";
  (acts||[]).forEach(function(o){var b=document.createElement("button");b.type="button";b.className="opt "+(o.cls||"");b.textContent=o.label;
    b.onclick=function(e){viaKey=e.detail===0;o.go()};dock.appendChild(b)});
  if(viaKey&&dock.firstChild){try{dock.firstChild.focus({preventScroll:true})}catch(e){}}
  viaKey=false;
  if(said.length){live.textContent="";setTimeout(function(){live.textContent=said.join(" ")},80)}
  var end=function(smooth){window.scrollTo({top:document.documentElement.scrollHeight,behavior:smooth&&!reduce?"smooth":"auto"})};
  if(first){if(Object.keys(a).length)end(false)}
  else if(grew)setTimeout(function(){end(true)},fresh*180);
  else if(opt.toEnd)end(false);
}
var tt;function toast(t){var e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){e.classList.remove("on")},2200)}
var rs=$("restart"),rt;
function disarm(){rs.removeAttribute("data-arm");rs.textContent="重来"}
rs.onclick=function(){
  if(!rs.hasAttribute("data-arm")){rs.setAttribute("data-arm","");rs.textContent="确定重来？";clearTimeout(rt);rt=setTimeout(disarm,3000);return}
  clearTimeout(rt);disarm();st.answers={};st.card=false;save();prev=-1;render();window.scrollTo(0,0);toast("答案清空了，准备清单的勾还留着")};
render();
})();
</script>
</body>
</html>
